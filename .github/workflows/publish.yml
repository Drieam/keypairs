name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Separate jobs so a failed upload can be retried with "Re-run failed jobs" without publishing twice
  publish-github:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: '3.4'

      - name: Build and publish gem to GitHub Package Registry
        run: |
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: Bearer ${{ secrets.GITHUB_TOKEN }}\n" > $HOME/.gem/credentials
          gem build --verbose *.gemspec
          gem push --verbose --key github --host https://rubygems.pkg.github.com/${OWNER} *.gem
        env:
          OWNER: Drieam

  publish-rubygems:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: '3.4'

      - name: Build and publish gem to RubyGems
        run: |
          gem build --verbose *.gemspec
          gem push --verbose *.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
