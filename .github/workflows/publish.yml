name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v7.0.1

      - name: Setup Ruby
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build and publish gem to registry
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          gem install bundler
          bundle config unset deployment
          bundle install
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:github: Bearer ${{ secrets.GITHUB_TOKEN }}\n" > $HOME/.gem/credentials
          gem build --verbose *.gemspec
          gem push --verbose --key github --host https://rubygems.pkg.github.com/${OWNER} *.gem
        env:
          OWNER: Drieam

      - name: Publish gem to RubyGems
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: gem push --verbose *.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
